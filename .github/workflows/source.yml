name: Android Source Checks
on:
  workflow_dispatch:
    inputs:
      checks:
        description: Select only checks justified for this change
        type: choice
        required: true
        options: [retired-inputs, workflow-lint, secrets]
      rationale:
        description: Concrete risk and necessity for the selected check
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: android-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CHECKS: ${{ inputs.checks }}
      RATIONALE: ${{ inputs.rationale }}
    steps:
      - name: Admit the explicit selection
        shell: bash
        run: |
          [[ "$RATIONALE" =~ [^[:space:]] ]] || { echo 'A concrete rationale is required.' >&2; exit 2; }
          case "$CHECKS" in retired-inputs|workflow-lint|secrets) ;;
            *) echo 'Unknown check; nothing was run.' >&2; exit 2 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Selected withdrawn-input admission
        if: ${{ inputs.checks == 'retired-inputs' }}
        run: python3 .github/scripts/check-design-inputs.py --case retired-inputs
      - uses: ./.github/actions/source-hygiene
        if: ${{ contains(fromJSON('["workflow-lint","secrets"]'), inputs.checks) }}
        with:
          directory: .
      - name: Readiness boundary
        if: always()
        run: |
          printf '%s\n' "Selected check: $CHECKS" 'All unselected checks: NOT_RUN. Source checks only; Gradle, Kotlin, Core, APK and device evidence remain OPEN.' >> "$GITHUB_STEP_SUMMARY"
