name: Android Source Checks
on:
  workflow_dispatch:
    inputs:
      checks:
        description: Select only checks justified for this change
        type: choice
        required: true
        options: [retired-inputs, workflow-lint, secrets]
      rationale:
        description: Concrete risk and necessity for the selected check
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: android-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CHECKS: ${{ inputs.checks }}
      RATIONALE: ${{ inputs.rationale }}
    steps:
      - name: Admit the explicit selection
        shell: bash
        run: |
          [[ "$RATIONALE" =~ [^[:space:]] ]] || { echo 'A concrete rationale is required.' >&2; exit 2; }
          case "$CHECKS" in retired-inputs|workflow-lint|secrets) ;;
            *) echo 'Unknown check; nothing was run.' >&2; exit 2 ;;
          esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Selected withdrawn-input admission
        if: ${{ inputs.checks == 'retired-inputs' }}
        run: python3 .github/scripts/check-design-inputs.py --case retired-inputs
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        if: ${{ contains(fromJSON('["workflow-lint","secrets"]'), inputs.checks) }}
        with:
          go-version: '1.24.2'
          cache: false
      - name: Selected workflow lint
        if: ${{ inputs.checks == 'workflow-lint' }}
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -color -shellcheck= -pyflakes= .github/workflows/source.yml
      - name: Selected current tracked-source secret scan
        if: ${{ inputs.checks == 'secrets' }}
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.24.2
          scan=$(mktemp -d "$RUNNER_TEMP/reader-source.XXXXXX")
          trap 'rm -rf "$scan"' EXIT
          git archive HEAD | tar -xf - -C "$scan"
          cd "$scan"
          "$(go env GOPATH)/bin/gitleaks" dir . --redact=100
      - name: Readiness boundary
        if: always()
        run: |
          printf '%s\n' "Selected check: $CHECKS" 'All unselected checks: NOT_RUN. Source checks only; Gradle, Kotlin, Core, APK and device evidence remain OPEN.' >> "$GITHUB_STEP_SUMMARY"
